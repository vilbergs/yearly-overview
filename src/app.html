<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Plan your whole year at a glance, one column per month." />
		<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131516" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="64x64" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/hanken-grotesk-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/eb-garamond-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="stylesheet" href="%sveltekit.assets%/css/main.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>Yearly Overview needs JavaScript to run.</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
