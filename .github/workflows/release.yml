name: Release

# Builds Raspberry Pi packages: on every push to main (as workflow artifacts) and, for version
# tags like v1.2.0, attached to a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [aarch64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.arch }}
      - run: pip install ziglang
      - run: cargo install cargo-zigbuild --locked
      - run: npm ci
      - run: scripts/package.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: yearly-overview-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
