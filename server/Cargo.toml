[package]
name = "yearly-overview-server"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
time = { version = "0.3.55", features = ["macros", "formatting", "parsing"] }
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header", "limit", "compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"

[lib]
name = "yearly_overview_server"
path = "src/lib.rs"

[[bin]]
name = "yearly-overview-server"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
